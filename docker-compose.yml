services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: image_relevance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/image_relevance
    ports:
      - "3000:3000"
    depends_on:
      - db

volumes:
  postgres_data:
