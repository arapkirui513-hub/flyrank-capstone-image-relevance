services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: image_relevance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro

  app:
    build: .
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/image_relevance
      VISION_PROVIDER:
      GROQ_API_KEY:
      GROQ_VISION_MODEL:
      GEMINI_API_KEY:
      VISION_MODEL:
      EMBEDDING_MODEL:
      EMBEDDING_MODEL_VERSION:
      GUARD_VERSION:
      AI_MAX_BUDGET:
    ports:
      - "3000:3000"
    volumes:
      - ./data/images:/app/data/images:ro
    depends_on:
      - db

volumes:
  postgres_data:
